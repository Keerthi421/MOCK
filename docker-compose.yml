services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mock
      POSTGRES_USER: mock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - mock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mock -d mock"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mock:${POSTGRES_PASSWORD:-local-dev-only-change-me}@db:5432/mock
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mock_pgdata:
